# Runs the repository lint on every push and pull request.
# The lint itself is scripts/check.sh; this file only calls it.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the repository lint
        run: bash scripts/check.sh
